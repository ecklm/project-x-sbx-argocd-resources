---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aks-baseline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
  sources:
    - repoURL: https://github.com/ecklm/cubix-pe-codes-8-dynamic-envs-kubernetes.git
      targetRevision: HEAD
      path: .
      helm:
        valuesObject:
          apps:
            certManager:
              letsencryptContactEmail: ecklm@ecklm.cubix-pe.hu
            externalDns:
              txtOwnerId: project-x-sbx-ecklm-az-cubix-pe-hu
              domainFilters:
                - project-x.sbx.ecklm.az.cubix-pe.hu
              azure:
                tenantId: 8820d9af-b533-4848-9bf3-ebf24d29d140
                subscriptionId: fba39c62-2b48-482e-8377-d811aa355544
                dnsResourceGroupName: project-x-sbx-dns
                workloadIdentityClientId: a9492fe6-5af5-4217-a952-32c88576837f
